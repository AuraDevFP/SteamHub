<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#10172a">
  <title>Внешняя ссылка — Steam Hub</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <style>
    .redirect-wrap{position:relative;isolation:isolate;min-height:100vh;display:grid;place-items:center;padding:28px 18px;overflow:hidden;background:#080b19}
    .redirect-wrap:before{content:"";position:fixed;inset:0;z-index:-2;background:linear-gradient(180deg,rgba(5,7,20,.18),rgba(5,7,20,.35)),url('assets/redirect-background.png') center center/cover no-repeat;transform:scale(1.025);animation:bg-drift 28s ease-in-out infinite alternate}
    .redirect-wrap:after{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 50% 35%,rgba(91,53,177,.18),transparent 48%),linear-gradient(90deg,rgba(5,7,20,.2),transparent 50%,rgba(5,7,20,.25));pointer-events:none}
    .redirect-card{position:relative;width:min(100%,520px);padding:clamp(28px,5vw,46px);border:1px solid rgba(157,139,255,.32);border-radius:28px;background:linear-gradient(145deg,rgba(14,17,39,.91),rgba(12,14,30,.84));box-shadow:0 28px 100px #0009,0 0 70px rgba(112,76,229,.12),inset 0 1px #ffffff12;text-align:center;backdrop-filter:blur(24px);animation:card-arrive .75s cubic-bezier(.2,.8,.2,1) both}
    .redirect-icon{position:relative;width:94px;height:94px;margin:0 auto 25px;border-radius:28px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(92,74,161,.34),rgba(36,29,77,.65));border:1px solid rgba(181,157,255,.45);box-shadow:0 0 35px #7c62dd35,inset 0 1px #ffffff22;animation:logo-float 3.6s ease-in-out infinite}
    .redirect-icon:before,.redirect-icon:after{content:"";position:absolute;inset:-9px;border:1px solid rgba(164,133,255,.5);border-radius:34px;animation:logo-orbit 8s linear infinite}
    .redirect-icon:after{inset:-16px;border-color:rgba(111,96,255,.25);border-radius:39px;animation-direction:reverse;animation-duration:12s}
    .redirect-icon img{width:61px;height:61px;object-fit:contain;filter:drop-shadow(0 0 12px rgba(156,126,255,.6));animation:logo-pulse 2.8s ease-in-out infinite}
    @keyframes logo-float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-7px) rotate(2deg)}}
    @keyframes logo-pulse{0%,100%{filter:drop-shadow(0 0 9px rgba(156,126,255,.45));transform:scale(.98)}50%{filter:drop-shadow(0 0 19px rgba(186,155,255,.9));transform:scale(1.06)}}
    @keyframes logo-orbit{to{transform:rotate(360deg)}}
    @keyframes bg-drift{from{transform:scale(1.025) translate3d(0,0,0)}to{transform:scale(1.09) translate3d(-1%,1%,0)}}
    @keyframes card-arrive{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
    .redirect-kicker{font-size:11px;letter-spacing:.2em;color:#a99aff;font-weight:800}
    .redirect-card h1{margin:12px 0;font-size:clamp(26px,5vw,36px);line-height:1.12}
    .redirect-card p{color:#aeb8d0;line-height:1.7;margin:0 auto 24px;max-width:370px}
    .destination-label{display:inline-block;max-width:100%;overflow-wrap:anywhere;margin:-8px auto 22px;padding:8px 12px;border:1px solid #a58cff35;border-radius:10px;background:#080b1b75;color:#c9baff;font-size:12px}
    .countdown{font-size:56px;font-weight:800;letter-spacing:-.06em;color:#c5b7ff;line-height:1.2;font-variant-numeric:tabular-nums}
    .count-label{color:#9aa6c2;font-size:13px;margin:4px 0 22px}
    .progress{height:5px;border-radius:99px;background:#ffffff12;overflow:hidden;margin:0 0 25px}
    .progress span{display:block;width:100%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#6450b4,#b7a4ff);transform-origin:left;animation:countdown 10s linear forwards}
    @keyframes countdown{to{transform:scaleX(0)}}
    .redirect-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
    .redirect-actions a,.redirect-actions button{font:inherit;font-weight:700;border-radius:12px;padding:13px 18px;cursor:pointer;text-decoration:none}
    .redirect-primary{border:0;background:linear-gradient(135deg,#6752bb,#8f76ed);color:#fff}
    .redirect-cancel{border:1px solid #ffffff24;background:#ffffff08;color:#e5e8f3}
    .redirect-foot{margin-top:24px;font-size:10px;letter-spacing:.13em;color:#66718d}
    @media(max-width:520px){.redirect-card{padding:28px 20px}.redirect-icon{width:80px;height:80px;border-radius:24px}.redirect-icon img{width:53px;height:53px}.redirect-actions{flex-direction:column}.redirect-actions a,.redirect-actions button{width:100%}}
    @media(prefers-reduced-motion:reduce){.progress span{animation:none;transform:scaleX(0)}.redirect-icon,.redirect-icon img,.redirect-icon:before,.redirect-icon:after,.redirect-card,.redirect-wrap:before{animation:none!important}}
  </style>
</head>
<body>
  <main class="redirect-wrap">
    <section class="redirect-card" aria-labelledby="redirect-title">
      <div class="redirect-icon" aria-hidden="true"><img src="assets/logo.svg" alt=""></div>
      <div class="redirect-kicker">STEAM HUB · БЕЗОПАСНЫЙ ПЕРЕХОД</div>
      <h1 id="redirect-title">Ты покидаешь <span class="gradient">Steam Hub</span></h1>
      <p id="redirect-description">Сейчас откроется внешний сайт. Если передумал, отмени переход — ты вернёшься на страницу, с которой пришёл.</p><div id="destination-label" class="destination-label">Подготовка внешней ссылки…</div>
      <div class="countdown" id="countdown" aria-live="polite">10</div>
      <div class="count-label">секунд до перехода</div>
      <div class="progress" aria-hidden="true"><span></span></div>
      <div class="redirect-actions">
        <a class="redirect-primary" id="go-now" href="#">Перейти сейчас</a>
        <button class="redirect-cancel" id="cancel" type="button">Отменить и остаться</button>
      </div>
      <div class="redirect-foot">Ты всегда можешь отменить переход и остаться на сайте</div>
    </section>
  </main>
  <script>
    (function(){
      var fallback='https://funpay.com/users/8180891/';
      var params=new URLSearchParams(window.location.search);
      var candidate=params.get('url');
      var destination=fallback;
      try { if(candidate){ var parsed=new URL(candidate); if(parsed.protocol==='https:' || parsed.protocol==='http:') destination=parsed.href; } } catch(e) {}
      var goNow=document.getElementById('go-now');
      goNow.href=destination;
      var label=document.getElementById('destination-label');
      var destinationName='внешний сайт';
      var destinationHost=destination;
      try {
        var destinationUrl=new URL(destination);
        destinationHost=destinationUrl.hostname.replace(/^www\./,'');
        var knownNames={
          'funpay.com':'FunPay','steamcommunity.com':'Steam Community','store.steampowered.com':'Steam','steampowered.com':'Steam',
          'steamdb.info':'SteamDB','steamid.io':'SteamID.io','steamrep.com':'SteamRep','steamladder.com':'Steam Ladder',
          'isthereanydeal.com':'IsThereAnyDeal','gg.deals':'GG.deals','pcgamingwiki.com':'PCGamingWiki',
          'chromewebstore.google.com':'Chrome Web Store','chrome.google.com':'Chrome Web Store','addons.mozilla.org':'Firefox Add-ons',
          'github.com':'GitHub','youtube.com':'YouTube','youtu.be':'YouTube','discord.com':'Discord','discord.gg':'Discord',
          'twitch.tv':'Twitch','x.com':'X','twitter.com':'X','reddit.com':'Reddit','google.com':'Google'
        };
        destinationName=knownNames[destinationHost] || destinationHost.split('.').slice(0,-1).join('.').replace(/[-_]/g,' ').replace(/\b\w/g,function(c){return c.toUpperCase();}) || destinationHost;
        var path=destinationUrl.pathname==='/'?'':destinationUrl.pathname;
        label.textContent='Сайт назначения: '+destinationName+' · '+destinationHost+path;
      } catch(e) { label.textContent='Сайт назначения: '+destination; }
      document.getElementById('redirect-title').innerHTML='Переход на <span class="gradient"></span>';
      document.querySelector('#redirect-title .gradient').textContent=destinationName;
      var remaining=10;
      var counter=document.getElementById('countdown');
      var cancelled=false;
      var timer=setInterval(function(){
        if(cancelled){clearInterval(timer);return;}
        remaining-=1;
        counter.textContent=String(Math.max(remaining,0));
        if(remaining<=0){clearInterval(timer);window.location.href=destination;}
      },1000);
      document.getElementById('cancel').addEventListener('click',function(){
        cancelled=true;clearInterval(timer);
        if(window.history.length>1){window.history.back();}
        else{window.location.href='index.html#library';}
      });
      document.getElementById('go-now').addEventListener('click',function(){clearInterval(timer);});
    })();
  </script>
</body>
</html>
